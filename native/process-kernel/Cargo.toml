[package]
name = "oompa-process-kernel"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false
license = "MIT"
autotests = false

[[bin]]
name = "oompa-process-kernel"
path = "src/main.rs"

[[bin]]
name = "process-kernel-fixture"
path = "tests/fixture.rs"
required-features = ["native-fixtures"]

[[test]]
name = "native"
path = "tests/native.rs"
required-features = ["native-fixtures"]

[features]
native-fixtures = []

[dependencies]
hmac = "=0.13.0"
sha2 = "=0.11.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
