[package]
name = "oompa-menubar"
version = "0.1.0"
description = "Oompa menu-bar companion for the local daemon"
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
desktop-foundation = { git = "https://github.com/hraness/desktop-foundation", tag = "v0.6.1" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
uuid = { version = "1", features = ["v4"] }
