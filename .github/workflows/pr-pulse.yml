name: Puerto Rico pulse

on:
  schedule:
    # Twice-daily refresh (morning and evening Atlantic) for the public /pr/
    # crisis board. GitHub may delay scheduled runs; the pulse also skips
    # writes when nothing changed.
    - cron: "21 11 * * *"
    - cron: "53 23 * * *"
  workflow_dispatch:

concurrency:
  # Data writes must finish once started; queue the next run instead of
  # cancelling a writer mid-commit.
  group: pr-pulse-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pulse:
    name: Refresh Puerto Rico snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Collect signals and write the snapshot
        env:
          # AI enrichment is optional. Without a provider key the pulse records
          # aiStatus "disabled" and ships deterministic data only. The gateway
          # key drives Spanish translation and relevance curation when set.
          PR_PULSE_AI_PROVIDER: auto
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.PR_PULSE_ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.PR_PULSE_OPENAI_API_KEY }}
        run: bun run pr/pulse.ts

      - name: Commit and push the refreshed data
        env:
          PULSE_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          test -f pr/data/snapshot.json
          test -f pr/data/history.json
          git add -- pr/data/snapshot.json pr/data/history.json
          if git diff --cached --quiet -- pr/data/; then
            echo "No snapshot changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --message "pr: refresh crisis snapshot"
          remote="https://x-access-token:${PULSE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2; do
            git fetch --no-tags origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH"
            if git push "$remote" "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              exit 0
            fi
            test "$attempt" = "1"
          done
          echo "::error::Could not publish the snapshot commit"
          exit 1
