name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }}, ${{ matrix.gate }})
    runs-on: ${{ matrix.os }}
    # Source shards and the ordered remainder cover the complete gate while
    # retaining every test's own deadline. The measured serial source suites
    # need a larger finite job budget than the ordered remainder. macOS also
    # needs headroom for setup and post-job cleanup after its measured gate.
    timeout-minutes: ${{ matrix.gate == 'remainder' && (matrix.os == 'macos-15' && 25 || 20) || 75 }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - ubuntu-24.04
        gate:
          - source-1
          - source-2
          - source-3
          - source-4
          - source-5
          - source-6
          - remainder
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Fetch only governed CI history
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::CI source is not one exact commit"
            exit 1
          fi
          test "$(git rev-parse --is-shallow-repository)" = "true"
          git fetch --force --no-tags --unshallow origin \
            "+$VERIFIED_SHA:refs/remotes/ci/verified"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$VERIFIED_SHA"
          test "$(git rev-parse --verify 'refs/remotes/ci/verified^{commit}')" = "$VERIFIED_SHA"
          while IFS= read -r ci_ref; do
            case "$ci_ref" in
              refs/remotes/ci/verified) ;;
              *)
                echo "::error::Unexpected ref entered governed CI history"
                exit 1
                ;;
            esac
          done < <(git for-each-ref --format='%(refname)')
          test "$(git for-each-ref --format='%(refname)' | wc -l | tr -d ' ')" = "1"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download pinned Zig 0.16.0 for authority supervisor (Linux)
        if: runner.os == 'Linux'
        run: |
          OOMPA_ZIG_DIRECTORY="$RUNNER_TEMP/oompa-zig-0.16.0"
          OOMPA_ZIG_ARCHIVE="$OOMPA_ZIG_DIRECTORY/zig-x86_64-linux-0.16.0.tar.xz"
          OOMPA_ZIG_SHA256="70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"
          mkdir -p "$OOMPA_ZIG_DIRECTORY"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 180 --retry 2 --retry-all-errors --retry-delay 1 \
            --output "$OOMPA_ZIG_ARCHIVE" \
            "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
          printf '%s  %s\n' "$OOMPA_ZIG_SHA256" "$OOMPA_ZIG_ARCHIVE" | sha256sum --check --status
          tar -xJf "$OOMPA_ZIG_ARCHIVE" -C "$OOMPA_ZIG_DIRECTORY"
          test -x "$OOMPA_ZIG_DIRECTORY/zig-x86_64-linux-0.16.0/zig"

      - name: Rebuild and verify authority-supervisor artifacts (Linux)
        if: runner.os == 'Linux'
        run: >-
          bun ./scripts/verify-authority-supervisor-build.ts
          --zig "$RUNNER_TEMP/oompa-zig-0.16.0/zig-x86_64-linux-0.16.0/zig"

      - name: Enable isolated user namespaces for native custody checks
        if: runner.os == 'Linux'
        run: |
          test "$(/usr/sbin/sysctl --values kernel.unprivileged_userns_clone)" = "1"
          sudo /usr/sbin/sysctl --write kernel.apparmor_restrict_unprivileged_userns=0
          test "$(/usr/sbin/sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = "0"
          /usr/bin/unshare --user --map-root-user --fork /usr/bin/true

      - name: Run the repository gate
        env:
          # Typed ESLint loads the complete repository project graph and can
          # exceed V8's default heap on the 7 GiB macOS runner.
          NODE_OPTIONS: "--max-old-space-size=4096"
          CI_GATE: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          case "$CI_GATE" in
            source-1) bun run test:source --shard=1/6 ;;
            source-2) bun run test:source --shard=2/6 ;;
            source-3) bun run test:source --shard=3/6 ;;
            source-4) bun run test:source --shard=4/6 ;;
            source-5) bun run test:source --shard=5/6 ;;
            source-6) bun run test:source --shard=6/6 ;;
            remainder) bun run check:ci-remainder ;;
            *)
              echo "::error::Unexpected CI gate"
              exit 1
              ;;
          esac

      - name: Restore Ubuntu user-namespace restriction
        if: ${{ always() && runner.os == 'Linux' }}
        run: |
          sudo /usr/sbin/sysctl --write kernel.apparmor_restrict_unprivileged_userns=1
          test "$(/usr/sbin/sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = "1"

  browser:
    name: Compiled app and site browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the browser driver runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"
          package-manager-cache: false
      - name: Install package-pinned Chromium
        run: node ./scripts/install-ci-chromium-deps.ts
      - name: Verify compiled browser surfaces
        run: |
          set -euo pipefail
          BUN_EXECUTABLE_PATH="$(command -v bun)"
          CHROMIUM_EXECUTABLE_PATH="$(node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(chromium.executablePath())')"
          export BUN_EXECUTABLE_PATH CHROMIUM_EXECUTABLE_PATH
          test -x "$BUN_EXECUTABLE_PATH"
          test -x "$CHROMIUM_EXECUTABLE_PATH"
          bun run check:browser
      - name: Retain browser acceptance receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiled-browser-receipts-${{ github.run_attempt }}
          path: |
            tmp/app-browser-*/receipt.json
            tmp/app-browser-*/preparation-result.json
            tmp/browser-custody-*/supervisor-result.json
            tmp/browser-custody-*/fixture-terminal.json
            tmp/browser-custody-*/observation-*.json
            tmp/browser-custody-*/trigger.json
            tmp/browser-custody-*/expiry.json
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7

  required:
    name: Required
    needs: [check, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every matrix check
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CHECK_RESULT" = "success" && test "$BROWSER_RESULT" = "success"
